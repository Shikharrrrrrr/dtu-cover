<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTU Practical File Cover Generator</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1c1b19;--muted:#6b675f;--line:#d8d4cb;--accent:#7a1f2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#23211e;--ink:#efece5;--muted:#a09b90;--line:#3a3732;--accent:#e08a96}}
:root[data-theme="dark"]{--bg:#171614;--panel:#23211e;--ink:#efece5;--muted:#a09b90;--line:#3a3732;--accent:#e08a96}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;gap:24px;max-width:1100px;margin:0 auto;padding:20px 16px 40px}
@media(min-width:900px){.app{grid-template-columns:340px 1fr;align-items:start}.panel{position:sticky;top:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h1{font:600 20px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:96px 1fr;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:8px;margin-top:18px}
button{font:inherit;font-weight:600;border-radius:6px;padding:10px 14px;cursor:pointer;border:1px solid var(--accent);flex:1}
.primary{background:var(--accent);color:#fff}
.ghost{background:transparent;color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.stage{overflow-x:auto}
.paper{width:210mm;height:297mm;margin:0 auto;background:#fff;color:#000;padding:16mm 18mm;border:1px solid #ccc;box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;text-align:center;font-family:"Times New Roman",Times,serif}
.paper p{margin:0}
.t1{font-size:24pt;font-weight:700;line-height:1.35}
.prog{font-size:12pt;font-weight:700;margin-top:9mm}
.in{font-size:10pt;margin-top:1.5mm}
.sm{font-size:11pt;margin-top:8mm}
.nm{font-size:13pt;font-weight:700;margin-top:3mm}
.roll{font-size:11pt;margin-top:2mm}
.semyr{font-size:12pt;font-weight:700;margin-top:9mm}
.semyr sup{font-size:.6em}
.pf{font-size:13pt;font-weight:700;margin-top:3mm}
.des{font-size:10.5pt;margin-top:2mm}
.logo{width:46mm;height:auto;margin-top:12mm}
.dept{font-size:12pt;font-weight:700;margin-top:auto}
.uni{font-size:12.5pt;margin-top:5mm;letter-spacing:.3px}
.fm{font-size:10pt;margin-top:4mm}
.adr{font-size:10.5pt;margin-top:3mm}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}.app{display:block;padding:0;max-width:none}.panel{display:none}
 .stage{overflow:visible}.paper{border:0;box-shadow:none;margin:0}
 :root{padding:0}
 html,body{height:297mm;overflow:hidden}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
<section class="panel" aria-label="Cover details">
 <h1>Practical file cover</h1>
 <p class="sub">Fill in the details. The cover updates as you type.</p>

 <label for="title">Cover title (use a new line for two lines)</label>
 <input id="title" value="Computer Workshop|Practical File">

 <label for="p1">Programme</label>
 <input id="p1" value="INTEGRATED B.SC. &amp; M.SC.">
 <label for="p2">Branch</label>
 <input id="p2" value="DATA SCIENCE">

 <label for="name">Your full name</label>
 <input id="name" autocomplete="name" placeholder="First Middle Last">
 <label for="roll">Roll number</label>
 <input id="roll" placeholder="2K26/XXXXX/YYY">

 <div class="row2">
  <div><label for="sem">Semester number</label><select id="sem"></select></div>
  <div><label for="yr">Year</label><select id="yr"></select></div>
 </div>

 <label for="prof">Professor's name</label>
 <div class="row">
  <select id="ptitle" aria-label="Title"><option>Dr.</option><option>Prof.</option><option>Mr.</option><option>Ms.</option><option value="">None</option></select>
  <input id="prof" placeholder="e.g. Shweta Meena">
 </div>
 <label for="des">Designation</label>
 <input id="des" value="Assistant Professor">
 <label for="dept">Department</label>
 <input id="dept" value="Software Engineering">

 <div class="actions">
  <button class="primary" id="print">Download PDF</button>
  <button class="ghost" id="reset">Reset</button>
 </div>
 <p class="hint" id="hint">Downloads an A4 PDF of the cover. Year follows the semester until you change it.</p>
</section>

<section class="stage" aria-label="Preview">
 <div class="paper">
  <div id="o-title"></div>
  <p class="prog" id="o-p1"></p>
  <p class="in">IN</p>
  <p class="prog" style="margin-top:4mm" id="o-p2"></p>
  <p class="sm">Submitted by:</p>
  <p class="nm" id="o-name"></p>
  <p class="roll" id="o-roll"></p>
  <p class="semyr" id="o-semyr"></p>
  <p class="sm" style="margin-top:10mm">Submitted to</p>
  <p class="pf" id="o-prof"></p>
  <p class="des" id="o-des"></p>
  <p class="des" id="o-dept"></p>

<script>
(function(){
 var ids=["title","p1","p2","name","roll","sem","yr","ptitle","prof","des","dept"];

 var KEY="dtu-practical-cover-v1",yrTouched=false;
 var el={};ids.forEach(function(i){el[i]=document.getElementById(i)});
 function fill(sel,max){for(var n=1;n<=max;n++){var o=document.createElement("option");o.value=String(n);o.textContent=n;sel.appendChild(o)}}
 fill(el.sem,10);fill(el.yr,5);
 function ord(n){n=+n;var s=["th","st","nd","rd"],v=n%100;return s[(v-20)%10]||s[v]||s[0]}
 function T(id,t){document.getElementById(id).textContent=t}
 function render(){
  var v={};ids.forEach(function(i){v[i]=el[i].value.trim()});
  var box=document.getElementById("o-title");box.innerHTML="";
  v.title.split("|").forEach(function(line){var p=document.createElement("p");p.className="t1";p.textContent=line.trim();box.appendChild(p)});
  T("o-p1",v.p1.toUpperCase());T("o-p2",v.p2.toUpperCase());
  T("o-name",(v.name||"FIRST_NAME MIDDLE_NAME LAST_NAME").toUpperCase());
  T("o-roll","(Roll No. "+(v.roll||"2K26/XXXXX/YYY")+")");
  var s=document.getElementById("o-semyr");
  s.innerHTML=v.sem+"<sup>"+ord(v.sem)+"</sup> SEM, "+v.yr+"<sup>"+ord(v.yr)+"</sup> YEAR";
  T("o-prof",((v.ptitle?v.ptitle+" ":"")+(v.prof||"Professor Name")).toUpperCase());
  T("o-des",v.des);
  T("o-dept","Department of "+v.dept);
  T("o-dept2","DEPARTMENT OF "+v.dept.toUpperCase());
  try{var d={};ids.forEach(function(i){d[i]=el[i].value});d._y=yrTouched;localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}
 }
 el.sem.addEventListener("change",function(){if(!yrTouched){el.yr.value=String(Math.ceil(+el.sem.value/2))}render()});
 el.yr.addEventListener("change",function(){yrTouched=true;render()});
 ids.forEach(function(i){if(i!=="sem"&&i!=="yr"){el[i].addEventListener("input",render);el[i].addEventListener("change",render)}});
 function buildPdf(){
  var J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  var doc=new J({unit:"mm",format:"a4"}),cx=105;
  function line(t,y,size,bold){doc.setFont("times",bold?"bold":"normal");doc.setFontSize(size);doc.text(t,cx,y,{align:"center"})}
  function semline(y){
   var parts=[[el.sem.value,0],[ord(el.sem.value),1],[" SEM, ",0],[el.yr.value,0],[ord(el.yr.value),1],[" YEAR",0]];
   doc.setFont("times","bold");var w=0;
   parts.forEach(function(p){doc.setFontSize(p[1]?7.5:12);p.w=doc.getTextWidth(p[0]);w+=p.w});
   var x=cx-w/2;
   parts.forEach(function(p){doc.setFontSize(p[1]?7.5:12);doc.text(p[0],x,p[1]?y-1.6:y);x+=p.w});
  }
  var v={};ids.forEach(function(i){v[i]=el[i].value.trim()});
  var tl=v.title.split("|"),y=30;
  tl.forEach(function(t){line(t.trim(),y,24,true);y+=12});
  line(v.p1.toUpperCase(),y+4,12,true);line("IN",y+11,10,false);line(v.p2.toUpperCase(),y+18,12,true);
  y=y+32;
  line("Submitted by:",y,11,false);
  line((v.name||"FIRST_NAME MIDDLE_NAME LAST_NAME").toUpperCase(),y+8,13,true);
  line("(Roll No. "+(v.roll||"2K26/XXXXX/YYY")+")",y+15,11,false);
  semline(y+28);
  line("Submitted to",y+42,11,false);
  line(((v.ptitle?v.ptitle+" ":"")+(v.prof||"Professor Name")).toUpperCase(),y+50,13,true);
  line(v.des,y+57,10.5,false);
  line("Department of "+v.dept,y+63,10.5,false);
  var img=document.querySelector(".logo");
  try{doc.addImage(img.src,"JPEG",cx-23,y+72,46,46.3)}catch(e){}
  line("DEPARTMENT OF "+v.dept.toUpperCase(),245,12,true);
  line("DELHI TECHNOLOGICAL UNIVERSITY",255,12.5,false);
  line("(Formerly Delhi College of Engineering)",262,10,false);
  line("Bawana Road, Delhi- 110042",269,10.5,false);
  return doc.output("arraybuffer");
 }
 var hint=document.getElementById("hint");
 document.getElementById("print").addEventListener("click",async function(){
  render();
  var dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  var buf=null;try{buf=buildPdf()}catch(e){}
  if(dl&&buf){
   var nm=(el.name.value.trim()||"Practical").replace(/[^A-Za-z0-9]+/g,"_");
   try{await dl.save({filename:nm+"_Cover_Page.pdf",data:buf})}
   catch(e){if(e&&e.code!=="declined")hint.textContent="Could not save the PDF here. Try opening the page in its own browser tab."}
   return;
  }
  if(buf){
   var a=document.createElement("a"),u=URL.createObjectURL(new Blob([buf],{type:"application/pdf"}));
   a.href=u;a.download=(el.name.value.trim()||"Practical").replace(/[^A-Za-z0-9]+/g,"_")+"_Cover_Page.pdf";
   document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
   return;
  }
  try{window.print()}catch(e){hint.textContent="Download is not available in this view. Open the page in its own tab and try again."}
 });
 document.getElementById("reset").addEventListener("click",function(){yrTouched=false;ids.forEach(function(i){el[i].value=defaults[i]});render()});

 render();
})();
